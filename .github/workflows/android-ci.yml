name: Android CI

on:
  workflow_dispatch:
    inputs:
      native_suite:
        description: "Optional native suite on an already provisioned host; none runs canonical CI only"
        required: true
        default: none
        type: choice
        options: [none, extra-time, subhub-pass, reconnect, battery, device-pass, dummy-preview]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

concurrency:
  # Preserve ordinary canonical cancellation, but never cancel an opted-in guest
  # merely because another run arrives. Its owned teardown must finish.
  group: android-ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.native_suite != 'none' && github.run_id || 'canonical' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.native_suite == 'none' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify version metadata
        run: python3 scripts/release_version.py
      - name: Test release-note generation
        env:
          RELEASE_NOTES_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -m unittest scripts.test_generate_release_notes scripts.test_release_version scripts.test_release_candidate_policy scripts.test_analyze_replacement_trace scripts.test_verify_canonical_ci scripts.test_sanitize_gradle_failure scripts.test_native_ci_policy scripts.test_native_preprovisioned scripts.test_run_extra_time_native scripts.test_extra_time_native_inventory
          python3 scripts/generate_release_notes.py --tag "$RELEASE_NOTES_REF" --check-only
      - name: Test, lint, and build universal APK
        shell: bash
        run: |
          # Consume raw diagnostics in memory; publish only fixed allowlisted labels.
          # Keep draining on parser limits/faults and preserve Gradle's own failure.
          set +e
          # Also contain the parent shell's version-dependent pipeline notices.
          {
            ./gradlew --stacktrace --console=plain testDebugUnitTest lintDebug assembleDebug 2>&1 | {
              python3 scripts/sanitize_gradle_failure.py 2>/dev/null
              sanitizer_status=$?
              if (( sanitizer_status != 0 )); then
                # Keep the pipe open even if Python fails before its drainer starts.
                dd of=/dev/null bs=4096 status=none 2>/dev/null
              fi
              exit "$sanitizer_status"
            } 2>/dev/null
            pipeline_status=("${PIPESTATUS[@]}")
          } 2>/dev/null
          set -e
          if (( pipeline_status[0] != 0 )); then
            exit "${pipeline_status[0]}"
          fi
          exit "${pipeline_status[1]}"
      - name: Record exact-source canonical qualification
        env:
          QUALIFIED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/verify_canonical_ci.py record --output build/reports/qualification.json
      - uses: actions/upload-artifact@v4
        with:
          name: SubHub-canonical-ci
          path: build/reports/qualification.json
          overwrite: true
          if-no-files-found: error
          retention-days: 90
      - name: Stage universal APK
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION_NAME=//p' version.properties)"
          apk="app/build/outputs/apk/debug/app-universal-debug.apk"
          test -f "$apk"
          mkdir -p dist
          cp "$apk" "dist/SubHub-${version}-universal-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SubHub-universal-debug
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  native:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.native_suite != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      NATIVE_SUITE: ${{ inputs.native_suite }}
      EXTRA_TIME_SELECTORS: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build paired APKs and run the selected native contracts once
        run: python3 scripts/run_extra_time_native.py --suite "$NATIVE_SUITE"
      - name: Retain synthetic native evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SubHub-extra-time-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/extra-time-native/
          if-no-files-found: error
          retention-days: 14
