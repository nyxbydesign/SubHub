name: Dummy preview native regression

on:
  pull_request:
    branches: [dev, master]
    paths:
      - '.github/workflows/dummy-preview-native.yml'
      - 'scripts/run_extra_time_native.py'
      - 'scripts/test_dummy_preview_inventory.py'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/java/com/subhub/app/people/DummySubPreview*.java'
      - 'app/src/main/java/com/subhub/app/people/PeopleActivity.java'
      - 'app/src/main/java/com/subhub/app/remote/PairingActivity.java'
      - 'app/src/main/java/com/subhub/app/util/FiveSecondBackGesture.java'
      - 'app/src/main/java/com/subhub/app/configuration/ConfigurationSettingCatalog.java'
      - 'app/src/main/res/values/dummy_sub_preview.xml'
      - 'app/src/androidTest/java/com/subhub/app/people/DummySubPreviewAndroidTest.java'
      - 'app/src/androidTest/java/com/subhub/app/remote/DummyPreviewEndpointFixture.java'

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      EXTRA_TIME_SUITE: dummy-preview
      EXTRA_TIME_SELECTORS: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify observer and explicit dummy inventory
        run: python3 -m unittest scripts.test_run_extra_time_native scripts.test_extra_time_native_inventory scripts.test_dummy_preview_inventory
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and qualify the dummy preview once
        run: python3 scripts/run_extra_time_native.py
      - name: Retain native evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SubHub-dummy-preview-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/extra-time-native/
          if-no-files-found: error
          retention-days: 14
