name: Extra-time native regression

on:
  pull_request:
    branches: [dev, master]
    paths:
      - ".github/workflows/extra-time-native.yml"
      - "scripts/run_extra_time_native.py"
      - "scripts/test_run_extra_time_native.py"
      - "scripts/test_extra_time_native_inventory.py"
      - "app/build.gradle"
      - "build.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "version.properties"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/java/com/subhub/app/appmode/ExtraTime*.java"
      - "app/src/main/java/com/subhub/app/appmode/AppTimerManager.java"
      - "app/src/main/java/com/subhub/app/remote/ExtraTime*.java"
      - "app/src/main/java/com/subhub/app/remote/RemoteSession*.java"
      - "app/src/main/java/com/subhub/app/remote/RemoteFeature.java"
      - "app/src/main/java/com/subhub/app/remote/RemoteConnectivityWake.java"
      - "app/src/main/java/com/subhub/app/remote/StableConnectionWake.java"
      - "app/src/androidTest/java/com/subhub/app/remote/RemoteFeatureSchedulingAndroidTest.java"
      - "app/src/androidTest/java/com/subhub/app/remote/RemoteBackgroundResponderAndroidTest.java"
      - "app/src/androidTest/java/com/subhub/app/remote/PairingLifecycleAndroidTest.java"
      - "app/src/main/java/com/subhub/app/remote/RemoteStore.java"
      - "app/src/main/java/com/subhub/app/remote/RemoteConfiguration.java"
      - "app/src/main/java/com/subhub/app/remote/RemoteContracts.java"
      - "app/src/main/java/com/subhub/app/configuration/ConfigurationSettingCatalog.java"
      - "app/src/main/java/com/subhub/app/stats/StatsRepository.java"
      - "app/src/main/java/com/subhub/app/penance/Penance*.java"
      - "app/src/main/java/com/subhub/app/people/PersonUi.java"
      - "app/src/main/java/com/subhub/app/people/RoleHomePresenter.java"
      - "app/src/main/res/layout/activity_penance.xml"
      - "app/src/main/res/values/extra_time*.xml"
      - "app/src/main/res/values/tribute_grouping_strings.xml"
      - "app/src/androidTest/java/com/subhub/app/appmode/ExtraTimeUiAndroidTest.java"
      - "app/src/androidTest/java/com/subhub/app/penance/TributeSettingsRestoreAndroidTest.java"
      - "app/src/androidTest/java/com/subhub/app/remote/ExtraTime*AndroidTest.java"
      - "app/src/androidTest/java/com/subhub/app/remote/RemoteExtraTimeUiFixture.java"
      - "app/src/androidTest/java/com/subhub/app/commitment/DurationChoicesAndroidTest.java"
      - "app/src/androidTest/java/com/subhub/app/commitment/ServiceDurationRetentionAndroidTest.java"
      - "app/src/androidTest/java/com/subhub/app/people/PersonRefreshAndroidTest.java"
      - "app/src/androidTest/java/com/subhub/app/remote/RemoteAppIconPresentationAndroidTest.java"
      - "app/src/androidTest/java/com/subhub/app/remote/RemoteConfigurationAndroidTest.java"
      - "app/src/androidTest/java/com/subhub/app/remote/RemoteDurationAndroidTest.java"
      - "app/src/androidTest/java/com/subhub/app/remote/RemoteEditorAndroidTest.java"
      - "app/src/androidTest/java/com/subhub/app/remote/RemoteSessionControlsAndroidTest.java"
      - "app/src/androidTest/java/com/subhub/app/stats/LazySessionDurationAndroidTest.java"
      - "app/src/androidTest/java/com/subhub/app/util/PageScrollViewAndroidTest.java"
      - "app/src/main/java/com/subhub/app/commitment/DurationChoicesView.java"
      - "app/src/main/java/com/subhub/app/commitment/ServiceDurationView.java"
      - "app/src/main/java/com/subhub/app/people/PersonActivity.java"
      - "app/src/main/java/com/subhub/app/people/LocalAppsActivity.java"
      - "app/src/main/java/com/subhub/app/appmode/AppModeActivity.java"
      - "app/src/main/java/com/subhub/app/remote/RemoteAppIcon*.java"
      - "app/src/main/java/com/subhub/app/remote/RemoteConfigurationAutosave.java"
      - "app/src/main/java/com/subhub/app/remote/RemoteConfigurationEdits.java"
      - "app/src/main/java/com/subhub/app/remote/RemoteDurationControls.java"
      - "app/src/main/java/com/subhub/app/remote/RemoteContractActivity.java"
      - "app/src/main/java/com/subhub/app/stats/DailyStatsStore.java"
      - "app/src/main/java/com/subhub/app/util/PageScrollView.java"
  workflow_dispatch:
    inputs:
      suite:
        description: "Fixed native suite: extra-time (21), SubHub integration (52), reconnect (6), or battery (26)"
        required: true
        default: extra-time
        type: choice
        options: [extra-time, subhub-pass, reconnect, battery]
      selectors:
        description: "Optional comma/newline-separated exact method subset of the chosen suite; empty runs the whole suite"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# Separate ephemeral runners retain older candidates; no in-progress run is cancelled.
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      # One existing job only. Label changes alone do not trigger a run; on the
      # next PR head, battery takes precedence over reconnect, then over integration and legacy subsets.
      # With native-subset, the producer reads exact JSON selectors directly from
      # GITHUB_EVENT_PATH. Never interpolate PR body text into a command or env.
      EXTRA_TIME_SUITE: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'native-battery') && 'battery' || github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'native-reconnect') && 'reconnect' || github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'native-subhub-pass') && 'subhub-pass' || inputs.suite || 'extra-time' }}
      EXTRA_TIME_SELECTORS: ${{ !contains(github.event.pull_request.labels.*.name, 'native-battery') && !contains(github.event.pull_request.labels.*.name, 'native-reconnect') && !contains(github.event.pull_request.labels.*.name, 'native-subhub-pass') && (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'native-extra-time-tribute-large') && 'com.subhub.app.penance.TributeSettingsRestoreAndroidTest#rulesAndSpendingLimitsRemainDistinctAfterNativeNavigationAndRecreation,com.subhub.app.appmode.ExtraTimeUiAndroidTest#largeFontNarrowReviewKeepsControlsAndReceiptsReadable' || github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'native-extra-time-ui') && 'com.subhub.app.appmode.ExtraTimeUiAndroidTest#requestApproveAndDeclineRetainAllowanceAndInputDrafts,com.subhub.app.appmode.ExtraTimeUiAndroidTest#remoteRequestIconArrivesWithoutPollingAndRevocationClearsIt,com.subhub.app.appmode.ExtraTimeUiAndroidTest#unavailableRequestExplainsItsStateAndRecoversBeforeOneTapSubmission,com.subhub.app.appmode.ExtraTimeUiAndroidTest#unsupportedPeerExplainsCapabilityAndRecoversAfterNegotiation,com.subhub.app.remote.ExtraTimeWireAndroidTest#failedHandshakePreservesOnlyPreviouslyNegotiatedCapability,com.subhub.app.remote.ExtraTimeRequestAndroidTest#retainedCapabilityCannotBypassConsentWorkspaceOrRevocation,com.subhub.app.penance.TributeSettingsRestoreAndroidTest#staleEnabledWidgetCannotReenableASavedOffRule,com.subhub.app.penance.TributeSettingsRestoreAndroidTest#staleDisabledWidgetCannotDisableASavedOnRule,com.subhub.app.penance.TributeSettingsRestoreAndroidTest#rulesAndSpendingLimitsRemainDistinctAfterNativeNavigationAndRecreation,com.subhub.app.appmode.ExtraTimeUiAndroidTest#largeFontNarrowReviewKeepsControlsAndReceiptsReadable' || inputs.selectors || '') || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test native observer admission and restoration
        run: python3 -m unittest scripts.test_run_extra_time_native
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate native suite inventory and selection
        run: python3 -m unittest scripts.test_extra_time_native_inventory
      - uses: gradle/actions/setup-gradle@v4
      - name: Build paired APKs and run the selected native contracts once
        run: python3 scripts/run_extra_time_native.py
      - name: Retain synthetic native evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SubHub-extra-time-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/extra-time-native/
          if-no-files-found: error
          retention-days: 14
