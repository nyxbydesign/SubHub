name: Extra-time native regression

on:
  pull_request:
    branches: [dev, master]
    paths:
      - ".github/workflows/extra-time-native.yml"
      - "scripts/run_extra_time_native.py"
      - "app/build.gradle"
      - "build.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "version.properties"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/java/com/subhub/app/appmode/ExtraTime*.java"
      - "app/src/main/java/com/subhub/app/appmode/AppTimerManager.java"
      - "app/src/main/java/com/subhub/app/remote/ExtraTime*.java"
      - "app/src/main/java/com/subhub/app/remote/RemoteSession*.java"
      - "app/src/main/java/com/subhub/app/remote/RemoteFeature.java"
      - "app/src/main/java/com/subhub/app/remote/RemoteStore.java"
      - "app/src/main/java/com/subhub/app/remote/RemoteConfiguration.java"
      - "app/src/main/java/com/subhub/app/remote/RemoteContracts.java"
      - "app/src/main/java/com/subhub/app/configuration/ConfigurationSettingCatalog.java"
      - "app/src/main/java/com/subhub/app/stats/StatsRepository.java"
      - "app/src/main/java/com/subhub/app/penance/Penance*.java"
      - "app/src/main/java/com/subhub/app/people/PersonUi.java"
      - "app/src/main/java/com/subhub/app/people/RoleHomePresenter.java"
      - "app/src/main/res/layout/activity_penance.xml"
      - "app/src/main/res/values/extra_time*.xml"
      - "app/src/main/res/values/tribute_grouping_strings.xml"
      - "app/src/androidTest/java/com/subhub/app/appmode/ExtraTimeUiAndroidTest.java"
      - "app/src/androidTest/java/com/subhub/app/penance/TributeSettingsRestoreAndroidTest.java"
      - "app/src/androidTest/java/com/subhub/app/remote/ExtraTime*AndroidTest.java"
      - "app/src/androidTest/java/com/subhub/app/remote/RemoteExtraTimeUiFixture.java"
  workflow_dispatch:
    inputs:
      selectors:
        description: "Optional comma/newline-separated subset of the fixed method inventory; empty runs all 21"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# Separate ephemeral runners retain older candidates; no in-progress run is cancelled.
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      EXTRA_TIME_SELECTORS: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'native-extra-time-tribute-large') && 'com.subhub.app.penance.TributeSettingsRestoreAndroidTest#rulesAndSpendingLimitsRemainDistinctAfterNativeNavigationAndRecreation,com.subhub.app.appmode.ExtraTimeUiAndroidTest#largeFontNarrowReviewKeepsControlsAndReceiptsReadable' || github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'native-extra-time-ui') && 'com.subhub.app.appmode.ExtraTimeUiAndroidTest#requestApproveAndDeclineRetainAllowanceAndInputDrafts,com.subhub.app.appmode.ExtraTimeUiAndroidTest#remoteRequestIconArrivesWithoutPollingAndRevocationClearsIt,com.subhub.app.appmode.ExtraTimeUiAndroidTest#unavailableRequestExplainsItsStateAndRecoversBeforeOneTapSubmission,com.subhub.app.appmode.ExtraTimeUiAndroidTest#unsupportedPeerExplainsCapabilityAndRecoversAfterNegotiation,com.subhub.app.remote.ExtraTimeWireAndroidTest#failedHandshakePreservesOnlyPreviouslyNegotiatedCapability,com.subhub.app.remote.ExtraTimeRequestAndroidTest#retainedCapabilityCannotBypassConsentWorkspaceOrRevocation,com.subhub.app.penance.TributeSettingsRestoreAndroidTest#staleEnabledWidgetCannotReenableASavedOffRule,com.subhub.app.penance.TributeSettingsRestoreAndroidTest#staleDisabledWidgetCannotDisableASavedOnRule,com.subhub.app.penance.TributeSettingsRestoreAndroidTest#rulesAndSpendingLimitsRemainDistinctAfterNativeNavigationAndRecreation,com.subhub.app.appmode.ExtraTimeUiAndroidTest#largeFontNarrowReviewKeepsControlsAndReceiptsReadable' || inputs.selectors || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build paired APKs and run the selected native contracts once
        run: python3 scripts/run_extra_time_native.py
      - name: Retain synthetic native evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SubHub-extra-time-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/extra-time-native/
          if-no-files-found: error
          retention-days: 14
